; PlatformIO project for the real firmware (not the sim/ desktop preview,
; which has its own Makefile and isn't an ESP32 target at all).
;
; board=esp32dev is the generic "Espressif ESP32 Dev Module" -- change it
; below if your specific board needs a different one (`pio boards esp32`
; lists what's available).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; sim/ and test/ are host-side (SDL desktop sim + a plain C++ unit test),
; not part of the ESP32 firmware -- excluded or this would try to compile
; SDL2 code for the xtensa toolchain and fail.
build_src_filter = +<*> -<sim/> -<test/>

; One firmware binary holds all four OperatingModes (nav.h) -- A2DP source
; AND sink, WiFi AP/server, and the TFT/touch stack are all linked in even
; though only one mode's subsystems actually start at runtime (see
; final-form.ino's setup()). huge_app.csv gives that extra flash headroom.
board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    paulstoffregen/XPT2046_Touchscreen
    https://github.com/pschatzmann/ESP32-A2DP.git

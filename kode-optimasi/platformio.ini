; PlatformIO project for this standalone LVGL UI shell (see README.md).
; Mirrors final-form/platformio.ini's src_dir=. convention.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; sim/ is a host-side SDL2 desktop preview (its own Makefile, built against a
; separately-cloned lvgl) -- not an ESP32 target, same reason final-form/
; excludes its sim/ too.
build_src_filter = +<*> -<sim/>

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    ; lv_conf.h discovery (the generic PlatformIO lvgl package needs this
    ; spelled out explicitly -- verified by building this exact folder).
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I.
    ; TFT_eSPI pin/driver config (library-compile-time, see TFT_eSPI_User_Setup.h)
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=17
    -D TFT_DC=27
    -D TFT_RST=33
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
